<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תיק עבודות — ניב פלג</title>
<style>
/*__FONTS__*/

/* ── tokens ─────────────────────────────────────────────────────────────── */
:root{
  --paper:#FFFCF5;      /* the sheet */
  --ink:#4B221C;        /* walnut */
  --ink-soft:#8A6A60;
  --blue:#C2D4E0;       /* drafting blue */
  --blue-deep:#3C5C78;
  --rule:#E8DFD2;

  --surface:#EFE7DA;    /* the desk the sheet lies on */
  --surface-2:#E3D8C7;
  --chrome:#6B4E45;
  --chrome-hi:#4B221C;
  --shadow:0 2px 4px rgba(75,34,28,.06), 0 18px 50px rgba(75,34,28,.14);
  --paper-filter:none;

  --f-display:'Frank Ruhl Libre', Georgia, serif;
  --f-body:'Assistant', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --surface:#171310; --surface-2:#221B17;
    --chrome:#A4897E; --chrome-hi:#EFE2D6;
    --shadow:0 2px 6px rgba(0,0,0,.5), 0 30px 70px rgba(0,0,0,.55);
    --paper-filter:brightness(.93) saturate(.97);
  }
}
:root[data-theme="dark"]{
  --surface:#171310; --surface-2:#221B17;
  --chrome:#A4897E; --chrome-hi:#EFE2D6;
  --shadow:0 2px 6px rgba(0,0,0,.5), 0 30px 70px rgba(0,0,0,.55);
  --paper-filter:brightness(.93) saturate(.97);
}
:root[data-theme="light"]{
  --surface:#EFE7DA; --surface-2:#E3D8C7;
  --chrome:#6B4E45; --chrome-hi:#4B221C;
  --shadow:0 2px 4px rgba(75,34,28,.06), 0 18px 50px rgba(75,34,28,.14);
  --paper-filter:none;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--surface); color:var(--ink);
  font-family:var(--f-body); direction:rtl;
  background-image:radial-gradient(120% 90% at 50% 0%, var(--surface-2) 0%, var(--surface) 62%);
  overflow:hidden;
}

/* ── stage ──────────────────────────────────────────────────────────────── */
#viewport{position:fixed; inset:0; overflow:hidden}
#stage{
  width:1600px; height:900px; position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%) scale(var(--s,1)); transform-origin:center center;
}
.slide{
  position:absolute; inset:0; background:var(--paper);
  filter:var(--paper-filter);
  box-shadow:var(--shadow);
  opacity:0; visibility:hidden; pointer-events:none;
  display:flex; flex-direction:column; overflow:hidden;
  padding:56px 72px 0;
}
.slide.on{opacity:1; visibility:visible; pointer-events:auto}
/* a hairline rule inset from the trim, like a plate mark */
.slide::before{
  content:""; position:absolute; inset:26px; border:1px solid var(--rule);
  pointer-events:none;
}

/* ── running head / foot ────────────────────────────────────────────────── */
.sheet-head{display:flex; flex:none; position:relative; z-index:2}
.head-l{display:flex; flex-direction:column; gap:6px}
.eyebrow{
  display:flex; align-items:center; gap:13px;
  font-size:12.5px; font-weight:600; letter-spacing:.22em; color:var(--blue-deep);
}
.eyebrow .num{font-variant-numeric:tabular-nums}
.eyebrow .rule{display:block; width:46px; height:1px; background:var(--blue)}
.eyebrow .sep{color:var(--blue); font-weight:400}
.stage-title{
  margin:0; font-family:var(--f-display); font-weight:700; font-size:40px;
  line-height:1.1; color:var(--ink); letter-spacing:-.005em;
}

.sheet-foot{
  position:absolute; left:72px; right:72px; bottom:34px;
  display:flex; align-items:center; justify-content:space-between;
  font-size:12px; letter-spacing:.2em; color:var(--ink-soft); font-weight:600;
  z-index:2; pointer-events:none;
}
.sheet-foot .pno{font-variant-numeric:tabular-nums; color:var(--blue-deep);
  direction:ltr; unicode-bidi:isolate}
.sheet-foot .pno i{font-style:normal; color:var(--blue); padding:0 3px}

/* ── motifs ─────────────────────────────────────────────────────────────── */
.motif{
  position:absolute; z-index:0; opacity:.62; pointer-events:none; user-select:none;
}
.motif.big{opacity:1}

/* ── cover ──────────────────────────────────────────────────────────────── */
.cover{flex:1; display:flex; flex-direction:column; justify-content:center;
  align-items:flex-start; padding-bottom:40px; position:relative}
.cover-grid{
  position:absolute; inset:-56px -72px; z-index:0; opacity:.5;
  background-image:
    linear-gradient(to left, var(--rule) 1px, transparent 1px),
    linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
  background-size:80px 80px;
  -webkit-mask-image:radial-gradient(70% 60% at 72% 50%, #000 0%, transparent 78%);
  mask-image:radial-gradient(70% 60% at 72% 50%, #000 0%, transparent 78%);
}
.cover h1{
  position:relative; margin:0; font-family:var(--f-display); font-weight:900;
  font-size:146px; line-height:.98; letter-spacing:-.01em; text-wrap:balance;
}
.cover-rule{position:relative; width:180px; height:2px; background:var(--ink);
  margin:34px 0 26px}
.cover-sub{position:relative; margin:0; font-size:26px; font-weight:300;
  color:var(--ink-soft); letter-spacing:.02em; font-variant-numeric:tabular-nums}

/* ── project divider ────────────────────────────────────────────────────── */
.divider{flex:1; display:flex; align-items:center; justify-content:flex-start;
  position:relative; padding-bottom:40px}
.div-text{position:relative; z-index:2; max-width:820px}
.div-num{
  display:flex; align-items:center; gap:16px;
  font-size:14px; font-weight:600; letter-spacing:.26em; color:var(--blue-deep);
  font-variant-numeric:tabular-nums; margin-bottom:22px;
}
.div-num i{display:block; width:110px; height:1px; background:var(--blue)}
.div-title{margin:0; font-family:var(--f-display); font-weight:900; font-size:96px;
  line-height:1.02; text-wrap:balance}
.div-sub{margin:18px 0 0; font-size:32px; font-weight:300; color:var(--ink-soft)}

/* ── working sheet ──────────────────────────────────────────────────────── */
.sheet{flex:1; display:flex; flex-direction:column; position:relative; min-height:0;
  padding-bottom:78px}
.prose{position:relative; z-index:2; max-width:1000px; margin:26px 0 0}
.prose p{margin:0 0 10px; font-size:20px; line-height:1.66; font-weight:300;
  color:var(--ink); text-wrap:pretty}
.prose p:last-child{margin-bottom:0}
.prose b{font-weight:700}

.figs{
  position:relative; z-index:2; flex:1; min-height:0; margin-top:30px;
  display:grid; grid-template-columns:repeat(12, 1fr); gap:0 26px; align-items:end;
}
.fig{display:flex; flex-direction:column; min-height:0; height:100%;
  justify-content:flex-end; gap:12px}
.fig.is-stacked{gap:10px}
.fig figcaption{
  font-size:14.5px; line-height:1.45; color:var(--ink-soft); text-align:center;
  font-weight:400; text-wrap:pretty;
}
.note{position:relative; z-index:2; margin:16px 0 0; font-size:17px; font-weight:300;
  color:var(--ink); text-align:center}

/* A plate is a frame that hugs its picture: the picture is sized by height,
   so the border always sits tight against the image edge. */
.plate{margin:0; min-height:0; min-width:0; flex:1;
  display:flex; align-items:flex-end; justify-content:center}
.plate-in{
  position:relative; display:flex; max-width:100%; max-height:100%;
  border:1.5px solid var(--ink); background:var(--paper);
}
.plate-in img{display:block; height:100%; width:auto; min-width:0}
.inset{
  position:absolute; width:auto; aspect-ratio:1; border-radius:50%;
  border:2.5px solid var(--ink); object-fit:cover; background:var(--paper);
  z-index:3;
}

/* slide 4: prose beside a single plate */
.split-body{flex:1; min-height:0; display:flex; gap:64px; align-items:stretch;
  margin-top:14px; padding-bottom:8px}
.split-body .prose{flex:0 0 44%; margin:auto 0; max-width:none}
.split-body .figs{flex:1; margin:0; display:flex; min-width:0}
.split-body .fig{flex:1; height:100%; justify-content:center; min-width:0}
.split-body .plate{align-items:center}

/* ── assembly steps ─────────────────────────────────────────────────────── */
.steps .step-row{
  position:relative; z-index:2; flex:1; min-height:0; margin-top:20px;
  display:flex; align-items:stretch; justify-content:space-between; gap:18px;
}
.steps .plate{flex:0 1 auto; align-items:center}
.steps .plate-in{border:0}
.chev{flex:none; align-self:center; width:30px; height:52px; position:relative}
.chev::before{
  content:""; position:absolute; inset:0; margin:auto; width:26px; height:26px;
  border-left:9px solid var(--ink); border-bottom:9px solid var(--ink);
  transform:rotate(45deg);
}

/* ── result ─────────────────────────────────────────────────────────────── */
.rgrid{position:relative; z-index:2; flex:1; min-height:0; margin-top:26px;
  display:flex; gap:22px; align-items:stretch}
.rcol{display:flex; flex-direction:column; gap:22px; min-width:0}
.rrow{flex:1; min-height:0; min-width:0; display:flex; gap:22px;
  justify-content:center; align-items:stretch}
.rrow .plate{align-items:center}

/* ── gallery ────────────────────────────────────────────────────────────── */
.gallery .lead{position:relative; z-index:2; margin:22px 0 0; font-size:19px;
  font-weight:300; color:var(--ink)}
.grow{position:relative; z-index:2; flex:1; min-height:0; margin-top:24px;
  display:flex; flex-direction:column; gap:20px}
.grow-1,.grow-2{flex:1; min-height:0; min-width:0; display:flex; gap:20px;
  justify-content:center; align-items:stretch}
.grow-1 .plate,.grow-2 .plate{align-items:center; flex:0 1 auto}
.grow-2{flex:1.02}

/* ── chrome ─────────────────────────────────────────────────────────────── */
#bar{
  position:fixed; z-index:50; bottom:20px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:6px; padding:6px;
  border:1px solid color-mix(in srgb, var(--chrome) 26%, transparent);
  border-radius:999px; background:color-mix(in srgb, var(--surface) 78%, transparent);
  backdrop-filter:blur(10px);
  opacity:.42; transition:opacity .25s ease;
}
#bar:hover,#bar:focus-within{opacity:1}
#bar button{
  appearance:none; border:0; background:transparent; cursor:pointer;
  color:var(--chrome); font-family:var(--f-body); font-size:13px; font-weight:600;
  letter-spacing:.12em; padding:7px 13px; border-radius:999px; line-height:1;
  display:flex; align-items:center; gap:8px;
}
#bar button:hover{color:var(--chrome-hi);
  background:color-mix(in srgb, var(--chrome) 12%, transparent)}
#bar button:focus-visible{outline:2px solid var(--blue-deep); outline-offset:2px}
#bar .count{color:var(--chrome); font-size:12px; letter-spacing:.16em;
  font-variant-numeric:tabular-nums; padding:0 10px; min-width:78px; text-align:center;
  direction:ltr; unicode-bidi:isolate}
#bar .count b{color:var(--chrome-hi); font-weight:600}
#bar .arrow{width:9px; height:9px; border-left:1.6px solid currentColor;
  border-bottom:1.6px solid currentColor; display:block}
#bar .arrow.next{transform:rotate(45deg)}
#bar .arrow.prev{transform:rotate(-135deg)}

#track{position:fixed; z-index:50; left:0; right:0; top:0; height:2px;
  background:transparent}
#track i{display:block; height:100%; background:var(--blue-deep); width:0;
  transition:width .4s cubic-bezier(.2,.7,.3,1)}

/* index overlay */
#index{
  position:fixed; inset:0; z-index:60; display:none; place-items:center;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(14px);
}
#index.on{display:grid}
.idx-wrap{width:min(1180px,88vw)}
.idx-title{font-family:var(--f-display); font-weight:700; font-size:24px;
  color:var(--chrome-hi); margin:0 0 26px; letter-spacing:.01em}
.idx-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
.idx-card{
  appearance:none; cursor:pointer; text-align:right; font-family:var(--f-body);
  background:var(--paper); border:1px solid var(--rule); border-radius:2px;
  min-height:172px; padding:22px 26px 20px 44%;
  display:flex; flex-direction:column; align-items:flex-end; justify-content:flex-end;
  gap:2px; position:relative; overflow:hidden;
  box-shadow:0 1px 2px rgba(75,34,28,.05), 0 10px 26px rgba(75,34,28,.07);
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.idx-card:hover{transform:translateY(-3px); border-color:var(--blue-deep);
  box-shadow:0 2px 4px rgba(75,34,28,.07), 0 18px 40px rgba(75,34,28,.12)}
.idx-card:focus-visible{outline:2px solid var(--blue-deep); outline-offset:3px}
.idx-art{position:absolute; inset:18px auto 18px 20px; width:34%; opacity:.5}
.idx-art img{width:100%; height:100%; object-fit:contain; object-position:left center}
.idx-n{font-size:11.5px; font-weight:600; letter-spacing:.24em; color:var(--blue-deep);
  font-variant-numeric:tabular-nums; position:absolute; top:20px; right:26px}
.idx-t{font-family:var(--f-display); font-weight:700; font-size:29px; color:var(--ink);
  line-height:1.12; position:relative}
.idx-s{font-size:14.5px; font-weight:300; color:var(--ink-soft); position:relative}

/* motion */
.slide.on .div-text,.slide.on .cover>*:not(.cover-grid),
.slide.on .sheet-head,.slide.on .prose,.slide.on .lead{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
.slide.on .prose,.slide.on .lead{animation-delay:.06s}
.slide.on .figs,.slide.on .rgrid,.slide.on .step-row,.slide.on .grow{
  animation:rise .6s cubic-bezier(.2,.7,.3,1) .1s both}
.slide.on .motif{animation:wipe .85s cubic-bezier(.3,.8,.3,1) both}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@keyframes wipe{
  from{opacity:0; clip-path:inset(0 0 100% 0)}
  to{opacity:.5; clip-path:inset(0 0 0 0)}
}
.slide.on .motif.big{animation-name:wipe-big}
@keyframes wipe-big{
  from{opacity:0; clip-path:inset(0 0 100% 0)}
  to{opacity:1; clip-path:inset(0 0 0 0)}
}
@media (prefers-reduced-motion: reduce){
  .slide.on *{animation:none !important}
  #track i{transition:none}
}
</style>

<div id="track"><i></i></div>
<div id="viewport"><div id="stage"><!--__SLIDES__--></div></div>

<nav id="bar" aria-label="ניווט בין שקופיות">
  <button id="next" title="השקופית הבאה"><i class="arrow next"></i>הבא</button>
  <span class="count"><b id="cur">01</b> / __COUNT__</span>
  <button id="prev" title="השקופית הקודמת">הקודם<i class="arrow prev"></i></button>
  <button id="toc" title="תוכן העניינים">תוכן</button>
</nav>

<div id="index" role="dialog" aria-modal="true" aria-label="תוכן העניינים">
  <div class="idx-wrap">
    <h2 class="idx-title">תיק עבודות — ניב פלג</h2>
    <div class="idx-grid"><!--__INDEX__--></div>
  </div>
</div>

<script>
(function(){
  const slides=[...document.querySelectorAll('.slide')];
  const stage=document.getElementById('stage');
  const bar={cur:document.getElementById('cur'),
             track:document.querySelector('#track i')};
  const index=document.getElementById('index');
  let i=0;

  function fit(){
    const s=Math.min((window.innerWidth-40)/1600, (window.innerHeight-78)/900);
    stage.style.setProperty('--s', s);
  }

  /* Frames hug their pictures: give every plate the exact box its image fills,
     and let plates sharing a row share one height so their edges line up. */
  const BORDER=3;
  const ratio=p=>[...p.querySelectorAll('.plate-in>img:not(.inset)')]
      .reduce((a,im)=>a+(im.naturalWidth/im.naturalHeight||1),0)||1;
  function setPlate(p,w,h){
    const inn=p.querySelector('.plate-in');
    inn.style.width=Math.max(0,w)+'px'; inn.style.height=Math.max(0,h)+'px';
  }
  function layoutPlates(){
    document.querySelectorAll('.eqrow').forEach(row=>{
      const plates=[...row.children].filter(el=>el.classList.contains('plate'));
      if(!plates.length) return;
      const gap=parseFloat(getComputedStyle(row).columnGap)||0;
      let avail=row.clientWidth-gap*(row.children.length-1);
      [...row.children].forEach(el=>{ if(!el.classList.contains('plate')) avail-=el.offsetWidth; });
      const rs=plates.map(ratio), sum=rs.reduce((a,b)=>a+b,0);
      const h=Math.min(row.clientHeight, (avail-BORDER*plates.length)/sum+BORDER);
      plates.forEach((p,k)=>{ p.style.flex='0 0 auto'; setPlate(p,(h-BORDER)*rs[k]+BORDER,h); });
    });
    document.querySelectorAll('.plate').forEach(p=>{
      if(p.parentElement.classList.contains('eqrow')) return;
      const r=ratio(p), cw=p.clientWidth, ch=p.clientHeight;
      let h=ch, w=(h-BORDER)*r+BORDER;
      if(w>cw){ w=cw; h=(w-BORDER)/r+BORDER; }
      setPlate(p,w,h);
    });
  }
  const ready=Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));
  function show(n,dir){
    i=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach((el,k)=>el.classList.toggle('on',k===i));
    bar.cur.textContent=String(i+1).padStart(2,'0');
    bar.track.style.width=(i/(slides.length-1)*100)+'%';
  }
  const next=()=>show(i+1), prev=()=>show(i-1);

  document.getElementById('next').onclick=next;
  document.getElementById('prev').onclick=prev;
  document.getElementById('toc').onclick=()=>index.classList.toggle('on');
  index.onclick=e=>{ if(e.target===index) index.classList.remove('on'); };
  document.querySelectorAll('.idx-card').forEach(b=>{
    b.onclick=()=>{ show(+b.dataset.go); index.classList.remove('on'); };
  });

  addEventListener('keydown',e=>{
    if(e.key==='Escape'){ index.classList.remove('on'); return; }
    if(index.classList.contains('on') && e.key!=='i') return;
    switch(e.key){
      case 'ArrowLeft': case 'PageDown': case ' ': next(); e.preventDefault(); break;
      case 'ArrowRight': case 'PageUp': prev(); e.preventDefault(); break;
      case 'Home': show(0); break;
      case 'End': show(slides.length-1); break;
      case 'i': case 'I': index.classList.toggle('on'); break;
    }
  });
  let wheelLock=0;
  addEventListener('wheel',e=>{
    const t=Date.now(); if(t-wheelLock<420 || Math.abs(e.deltaY)<12) return;
    wheelLock=t; e.deltaY>0?next():prev();
  },{passive:true});

  addEventListener('resize',()=>{fit(); layoutPlates();});
  fit(); show(0);
  ready.then(()=>{ layoutPlates();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(layoutPlates);
  });
})();
</script>
